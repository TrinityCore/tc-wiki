<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Edit · TrinityCore Wiki</title>
  <link rel="icon" href="/tc_logo.png">
  <style>
    #review-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
      max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 6px; cursor: pointer;
      background: #fff3cd; color: #664d03; border: 1px solid #ffda6a; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      font: 14px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Decap loads its lazy chunks from the same pinned version directory. -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.16.3/dist/decap-cms.js" integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p" crossorigin="anonymous"></script>
  <!-- Saves stay draft pull requests, which are never checked or merged, until the
       author sets the status to In review. Say so right after each save. -->
  <div id="review-hint" role="status" hidden onclick="this.hidden = true">
    Saved as a draft. When you are done, set <b>Status</b> (next to Save) to <b>In review</b>.
    Drafts are not checked or merged.
  </div>
  <script>
    CMS.registerEventListener({ name: 'postSave', handler: () => { document.getElementById('review-hint').hidden = false } })
  </script>
</body>
</html>
