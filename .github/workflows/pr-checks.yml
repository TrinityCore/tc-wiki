name: PR checks

on:
  pull_request:
    branches: [main]
    # ready_for_review: Decap marks a fork's entry "In review" by taking its PR out of draft.
    types: [opened, synchronize, reopened, ready_for_review]

# Runs the pull request's own code, so it gets a read-only token and no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run docs:build
