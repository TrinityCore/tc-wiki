name: PR checks

on:
  # Builds main too, for the README's build badge. Merges made by auto-merge.yml
  # don't start this, and Cloudflare Pages deploys the site on its own.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: Decap marks a fork's entry "In review" by taking its PR out of draft.
    types: [opened, synchronize, reopened, ready_for_review]

# Runs the pull request's own code, so it gets a read-only token and no secrets.
permissions:
  contents: read

# A new push to a pull request cancels its older build. Builds of main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run docs:build
