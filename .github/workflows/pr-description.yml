name: PR description

# Replaces the stock "Automatically generated by Sveltia CMS" body of pull requests
# opened by the page editor at /edit with the changed pages and what happens next.
on:
  # pull_request_target gives fork PRs a token that can edit the description.
  # Nothing here checks out or runs the pull request's code; it only reads the file list.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  describe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Write the description
        run: |
          set -euo pipefail

          # Leave pull requests written by hand alone.
          marker='<!-- wiki-editor -->'
          stock='Automatically generated by Sveltia CMS'
          case "$BODY" in
            "$stock"*|*"$marker"*) ;;
            *) echo "Hand-written description, skipping."; exit 0 ;;
          esac

          # File names come from the PR author: keep only plain page paths, and show
          # them inside code spans so they cannot add markdown of their own.
          files=$(gh pr diff "$NUMBER" --name-only)
          pages=$(grep -E '^[A-Za-z0-9._/-]+\.md$' <<<"$files" || true)
          total=$(grep -c . <<<"$files" || true)
          shown=$(head -n 20 <<<"$pages" | grep . || true)

          {
            echo "$marker"
            echo "Edited with the [wiki editor](https://trinitycore.info/edit/) by [$AUTHOR](https://github.com/$AUTHOR)."
            echo
            echo "**Changed pages** ($total file(s)):"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- [\`$f\`](https://trinitycore.info/${f%.md})"
            done <<<"$shown"
            [ "$(grep -c . <<<"$pages" || true)" -gt 20 ] && echo "- and more, see **Files changed**."
            echo
            echo "**What happens next**"
            echo "- A draft pull request is not checked or merged. The author sets **Status** to **In review** in the editor when the edit is finished."
            echo "- After that the site builds and the safety check runs. If both pass, the pull request is merged automatically. Otherwise a maintainer reviews it."
          } > body.md

          gh pr edit "$NUMBER" --body-file body.md
